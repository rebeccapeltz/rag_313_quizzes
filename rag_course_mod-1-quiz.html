<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Course Module 1 Review Quiz</title>
  <link rel="icon" href="./quizz.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="wrapper">
    <h2 class="sr-only">RAG Course Review Quiz</h2>
    <h3>Module 1: Introduction to RAG</h3>

    <div id="quiz-app">
      <div class="module-tabs" id="tabs"></div>
      <div><button class="reset-btn" id="reset-btn">Reset module</button></div>
      
      <div class="score-bar">
        <div class="score">
          <span class="score-num" id="score-display">0</span> / 
          <span id="total-display">0</span> correct
        </div>
      </div>

      <div class="module-label" id="module-label"></div>
      <div id="questions-container"></div>
    </div>
  </div>

  <script type="module">
    import { modules } from './module1.js';

    class QuizApp {
      constructor(modules) {
        this.modules = modules;
        this.currentModuleIndex = 0;
        // Initialize state: an array of arrays (one for each module)
        this.state = this.modules.map(m => m.questions.map(() => null));
        
        // Cache DOM elements
        this.qsContainer = document.getElementById('questions-container');
        this.scoreDisplay = document.getElementById('score-display');
        this.totalDisplay = document.getElementById('total-display');
        this.labelDisplay = document.getElementById('module-label');
        this.resetBtn = document.getElementById('reset-btn');

        this.init();
      }

      init() {
        this.render();
        this.setupEventListeners();
      }

      setupEventListeners() {
        // Event Delegation: One listener for all question clicks
        this.qsContainer.addEventListener('click', (e) => {
          const btn = e.target.closest('.opt-btn');
          if (!btn || btn.disabled) return;

          const qIdx = parseInt(btn.dataset.qidx);
          const oIdx = parseInt(btn.dataset.oidx);
          this.handleAnswer(qIdx, oIdx);
        });

        this.resetBtn.addEventListener('click', () => this.resetModule());
      }

      handleAnswer(qIdx, oIdx) {
        const question = this.modules[this.currentModuleIndex].questions[qIdx];
        const isCorrect = oIdx === question.ans;
        
        this.state[this.currentModuleIndex][qIdx] = isCorrect;
        this.render();
      }

      resetModule() {
        this.state[this.currentModuleIndex] = this.state[this.currentModuleIndex].map(() => null);
        this.render();
      }

      calculateScore() {
        const currentState = this.state[this.currentModuleIndex];
        return currentState.reduce((acc, val) => (val === true ? acc + 1 : acc), 0);
      }

      createQuestionHTML(q, qIdx) {
        const answerStatus = this.state[this.currentModuleIndex][qIdx];
        const isAnswered = answerStatus !== null;

        const optionsHTML = q.opts.map((opt, oIdx) => {
          let modifierClass = '';
          if (isAnswered) {
            if (oIdx === q.ans) modifierClass = 'correct';
          }

          const isDimmed = isAnswered && oIdx !== q.ans;

          return `
            <button class="opt-btn ${modifierClass}" 
              data-qidx="${qIdx}" 
              data-oidx="${oIdx}"
              ${isAnswered ? 'disabled' : ''}
              ${isDimmed ? 'style="opacity:0.5"' : ''}>
              <span class="opt-letter">${String.fromCharCode(65 + oIdx)}.</span>
              <span>${opt}</span>
            </button>`;
        }).join('');

        const feedbackHTML = isAnswered ? `
          <div class="feedback ${answerStatus ? 'correct' : 'wrong'}">
            ${answerStatus ? '✓ Correct. ' : '✗ Not quite. '}${q.exp}
          </div>` : '';

        return `
          <div class="q-card">
            <div class="q-num">Question ${qIdx + 1} of ${this.modules[this.currentModuleIndex].questions.length}</div>
            <div class="q-text">${q.q}</div>
            <div class="options">${optionsHTML}</div>
            ${feedbackHTML}
          </div>`;
      }

      render() {
        const module = this.modules[this.currentModuleIndex];
        
        // Update Stats
        this.labelDisplay.textContent = module.label;
        this.scoreDisplay.textContent = this.calculateScore();
        this.totalDisplay.textContent = module.questions.length;

        // Update Questions
        this.qsContainer.innerHTML = module.questions
          .map((q, i) => this.createQuestionHTML(q, i))
          .join('');
      }
    }

    // Start the app
    new QuizApp(modules);
  </script>
</body>
</html>
